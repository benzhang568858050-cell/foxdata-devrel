name: DevRel Auto Publish

on:
  schedule:
    # 每 3 小时一次（8 窗口容错，防止 cron 偶发缺失导致漏发）
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（缓存加速）
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: pip install -q twikit requests || pip install -q requests

      - name: 写入凭据（GitHub Secrets）
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHDNODE_PAT: ${{ secrets.HASHDNODE_PAT }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
        run: |
          mkdir -p config
          if [ -n "$X_COOKIES" ]; then echo "$X_COOKIES" > config/x_cookies.json; fi
          if [ -n "$DEVTO_API_KEY" ]; then echo "{\"api_key\":\"$DEVTO_API_KEY\"}" > config/devto_creds.json; fi
          if [ -n "$HASHDNODE_PAT" ]; then echo "{\"pat\":\"$HASHDNODE_PAT\",\"publication_id\":\"6a86e7d681b62cc8b3d6ec93\"}" > config/hashnode_creds.json; fi
          if [ -n "$PH_TOKEN" ]; then echo "{\"token\":\"$PH_TOKEN\"}" > config/ph_creds.json; fi

      - name: 一键自动化（拉数据+计划+发布）
        run: python3 auto.py || true

      - name: AI 运营引擎（监控+分析+救活+互链+策略）
        run: python3 auto.py devto-ops || true

      - name: X 热点采集（无凭据时自动跳过）
        run: python3 clients/collect_hotspots.py || true

      - name: Dev.to 评论互动（每日限频 2-3 篇，保守策略）
        run: python3 clients/devto_commenter.py || true

      - name: 更新 README 索引
        run: python3 clients/github_client.py readme || true

      - name: 仅在真实变化时提交回仓库
        run: |
          git config user.name "devrel-bot"
          git config user.email "devrel-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无实质变化，跳过提交（风控保护）"
          else
            git commit -m "chore: sync publish state [$(date +%Y-%m-%d)]"
            git pull --rebase origin main || true
            git push || true
          fi
